<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lixity</title>
    <style>
      :root {
        --bg: #f8fafc;
        --fg: #0f172a;
        --muted: #475569;
        --border: rgba(15, 23, 42, 0.12);
        --track: rgba(41, 73, 204, 0.16);
        --accent: #2949cc;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #111827;
          --fg: #f8fafc;
          --muted: #94a3b8;
          --border: rgba(248, 250, 252, 0.12);
          --track: rgba(59, 94, 245, 0.24);
          --accent: #3b5ef5;
        }
      }
      * {
        box-sizing: border-box;
      }
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
        background: var(--bg);
        color: var(--fg);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }
      main {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        padding: 28px 32px;
        border: 1px solid var(--border);
      }
      .mark {
        width: 56px;
        height: 56px;
        display: block;
      }
      h1 {
        margin: 0;
        font-size: 20px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      p {
        margin: 0;
        font-size: 13px;
        color: var(--muted);
        text-align: center;
      }
      .bar {
        width: 180px;
        height: 4px;
        border-radius: 999px;
        background: var(--track);
        overflow: hidden;
        margin-top: 4px;
      }
      .bar-fill {
        width: 45%;
        height: 100%;
        border-radius: 999px;
        background: var(--accent);
        animation: lixity-slide 1.25s ease-in-out infinite;
      }
      @keyframes lixity-slide {
        0% { transform: translateX(-100%); }
        50% { transform: translateX(120%); }
        100% { transform: translateX(260%); }
      }
      @media (prefers-reduced-motion: reduce) {
        .bar-fill {
          width: 100%;
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <svg class="mark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" aria-hidden="true">
        <style>
          .bg { fill: #2949cc; }
          .fg { fill: #ffffff; }
          .bars { fill: #c9d4ff; }
          @media (prefers-color-scheme: dark) {
            .bg { fill: #3b5ef5; }
            .fg { fill: #f8faff; }
            .bars { fill: #dbe4ff; }
          }
        </style>
        <rect class="bg" width="32" height="32" rx="7"/>
        <rect class="fg" x="7.8" y="6.5" width="4.6" height="19" rx="1.5"/>
        <rect class="fg" x="7.8" y="21.2" width="13.2" height="4.3" rx="1.5"/>
        <rect class="bars" x="15.3" y="8.2" width="8.6" height="2.3" rx="1.15"/>
        <rect class="bars" x="15.3" y="12.5" width="6.3" height="2.3" rx="1.15"/>
        <rect class="bars" x="15.3" y="16.8" width="4.2" height="2.3" rx="1.15"/>
      </svg>
      <h1>Lixity</h1>
      <p id="status">Starting local offline workspace…</p>
      <div class="bar" aria-hidden="true"><div class="bar-fill"></div></div>
    </main>
    <script>
      (function () {
        var labels = {
          de: "Lokaler Offline-Arbeitsbereich wird gestartet…",
          en: "Starting local offline workspace…",
          fr: "Démarrage de l’espace de travail hors ligne…",
          es: "Iniciando espacio de trabajo local sin conexión…",
          it: "Avvio dell’area di lavoro locale offline…",
          pt: "Iniciando espaço de trabalho local offline…",
          nl: "Lokale offline werkruimte wordt gestart…"
        };
        var lang = String(navigator.language || "en").toLowerCase().split("-")[0];
        var el = document.getElementById("status");
        if (el && labels[lang]) {
          el.textContent = labels[lang];
        }
      })();
    </script>
  </body>
</html>
