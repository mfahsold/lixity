<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Desktop WebView smoke test</title>
<a id="license" href="https://github.com/mfahsold/lixity/blob/main/LICENSE" target="_blank" rel="noopener noreferrer">License</a>
<a id="commercial-license" href="https://github.com/mfahsold/lixity/blob/main/docs/LICENSING.md#when-to-talk-to-the-maintainer" target="_blank" rel="noopener noreferrer">Commercial license</a>
<a id="same-window" href="https://example.org/contact">Contact</a>
<script nonce="ipc-smoke">
document.addEventListener("DOMContentLoaded", async () => {
  try {
    const bridge = window.lixityDesktop;
    if (await bridge.getPreferences() !== "Rust IPC reached") throw new Error("IPC response missing");
    const inventory = await bridge.getRuntimeEnvironment();
    if (inventory.schema_version !== "lixity-desktop-env/1" ||
        inventory.app?.version !== "0.0.0-smoke" || !inventory.app.desktop_mode) {
      throw new Error("Runtime environment response missing");
    }
    const recording = await bridge.audioCapture.recordingStatus();
    if (recording.recording !== false || recording.max_duration_seconds !== 60) {
      throw new Error("Interactive recording limit missing");
    }
    if (await bridge.audioCapture.startRecording(null, "synthetic.wav", 37) !== 37 ||
        await bridge.audioCapture.startRecording(null, "synthetic.wav") !== null) {
      throw new Error("Configured recording limit was not passed through the bridge");
    }
    await bridge.setWorkspaceTitle(" A synthetic project ");
    const sample = await bridge.readSampleManuscript();
    if (sample.language !== "en" || !sample.content.includes("# The Crate at Warehouse 4")) {
      throw new Error("Bundled sample missing");
    }
    await bridge.openExternalUrl("https://example.org/");
    const rejected = await bridge.openExternalUrl("file:///synthetic").then(
      () => false,
      error => String(error).includes("Only https:// and mailto:")
    );
    if (!rejected) throw new Error("Unsupported URL was accepted");
    await fetch("/bridge-ok");
    document.getElementById("license").click();
    setTimeout(() => document.getElementById("commercial-license").click(), 250);
    setTimeout(() => document.getElementById("same-window").click(), 500);
  } catch (error) {
    await fetch("/bridge-failed");
  }
});
</script>
