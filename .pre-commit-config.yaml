# Optional local hooks. Install pre-commit separately, then: pre-commit install
# Full local checks: make check.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # These assets have checksum or upstream byte-preservation contracts.
      - id: trailing-whitespace
        exclude: &byte_preserved '^(src/lixity/ui/assets/vendor/|docs/demo/((reader|companion)/)?licenses/|samples/first-look\.md$)'
      - id: end-of-file-fixer
        exclude: *byte_preserved
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=512"]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.6
    hooks:
      - id: ruff-check
        files: ^(src|tests|scripts)/
