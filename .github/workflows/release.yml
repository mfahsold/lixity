name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Published immutable release tag to promote to PyPI (for example v0.4.2)
        required: true
        type: string
permissions:
  contents: read
env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
jobs:
  preflight:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      candidate_run_id: ${{ steps.candidate.outputs.run_id }}
      candidate_artifact_id: ${{ steps.candidate.outputs.artifact_id }}
      desktop_run_id: ${{ steps.desktop.outputs.run_id }}
      desktop_artifact_id: ${{ steps.desktop.outputs.artifact_id }}
      desktop_qualification_digest: ${{ steps.desktop.outputs.qualification_digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Identify the tagged source and release state
        id: release_state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/release_channels.py inspect --root . --tag "$RELEASE_TAG" \
            --expected-commit "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY" --github-output "$GITHUB_OUTPUT"
      - name: Verify release notes against the tagged source
        if: steps.release_state.outputs.state != 'published'
        run: python scripts/check_release.py --source-only --require-release-notes --tag "$RELEASE_TAG"
      - name: Resolve the qualified release candidate for the tagged commit
        id: candidate
        if: steps.release_state.outputs.state != 'published'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/release_channels.py verify-rc --root . --tag "$RELEASE_TAG" \
            --expected-commit "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY" --github-output "$GITHUB_OUTPUT"
      - name: Identify the signed desktop bundle for this tag
        id: desktop
        if: steps.release_state.outputs.state != 'published' && vars.DESKTOP_RELEASE_TAG == env.RELEASE_TAG
        env:
          GH_TOKEN: ${{ github.token }}
          DESKTOP_RUN_ID: ${{ vars.DESKTOP_RELEASE_RUN_ID }}
          DESKTOP_QUALIFICATION: ${{ vars.DESKTOP_RELEASE_QUALIFICATION }}
        run: |
          [[ "$DESKTOP_RUN_ID" =~ ^[1-9][0-9]*$ ]] || { echo "::error::Set DESKTOP_RELEASE_RUN_ID."; exit 1; }
          printf '%s\n' "$DESKTOP_QUALIFICATION" |
            jq -es --arg tag "$RELEASE_TAG" --arg sha "$GITHUB_SHA" \
              'length == 1 and (.[0] | .tag == $tag and .source_sha == $sha)' >/dev/null || {
              echo "::error::DESKTOP_RELEASE_QUALIFICATION must match the tag and source commit."
              exit 1
            }
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$DESKTOP_RUN_ID" |
            jq -e --arg sha "$GITHUB_SHA" '
              .path == ".github/workflows/desktop-release.yml" and
              .event == "workflow_dispatch" and .conclusion == "success" and
              .head_branch == "main" and .head_sha == $sha' >/dev/null || {
              echo "::error::Choose a successful desktop workflow run on main for this source commit."
              exit 1
            }
          artifact_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$DESKTOP_RUN_ID/artifacts?name=lixity-desktop-release-bundle" |
            jq -er '.artifacts | map(select(.name == "lixity-desktop-release-bundle" and .expired == false)) |
              if length == 1 then .[0] else empty end |
              select(.digest | strings | test("^sha256:[0-9a-f]{64}$")) | .id | numbers')" || {
            echo "::error::The selected run must retain one unexpired signed desktop release bundle with its SHA-256 digest."
            exit 1
          }
          qualification_digest="$(printf '%s' "$DESKTOP_QUALIFICATION" | sha256sum | cut -d ' ' -f1)"
          printf 'run_id=%s\nartifact_id=%s\nqualification_digest=%s\n' \
            "$DESKTOP_RUN_ID" "$artifact_id" "$qualification_digest" >> "$GITHUB_OUTPUT"

  publish:
    needs: preflight
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    concurrency:
      group: release-github-publication
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Determine the release state without masking query failures
        id: release_state
        run: |
          python scripts/release_channels.py inspect --root . --tag "$RELEASE_TAG" \
            --expected-commit "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY" --github-output "$GITHUB_OUTPUT"
      - name: Recover immutable published artifacts on a rerun
        if: steps.release_state.outputs.state == 'published'
        run: |
          python scripts/release_channels.py recover --root . --tag "$RELEASE_TAG" \
            --expected-commit "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY" --dist dist
      - name: Require the candidate selected by preflight for new publication
        if: steps.release_state.outputs.state != 'published'
        env:
          RC_RUN_ID: ${{ needs.preflight.outputs.candidate_run_id }}
          RC_ARTIFACT_ID: ${{ needs.preflight.outputs.candidate_artifact_id }}
        run: |
          if [[ -z "$RC_RUN_ID" || -z "$RC_ARTIFACT_ID" ]]; then
            echo "::error::Rerun preflight so it can select the qualified candidate."
            exit 1
          fi
      - name: Fetch the verified release candidate identified by preflight
        if: steps.release_state.outputs.state != 'published'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.preflight.outputs.candidate_run_id }}
          artifact-ids: ${{ needs.preflight.outputs.candidate_artifact_id }}
          path: ${{ runner.temp }}/candidate-archive
          # Verify the download digest before extracting with Python's zipfile.
          skip-decompress: true
      - name: Verify source, checksums and build attestations for the selected candidate
        if: steps.release_state.outputs.state != 'published'
        run: |
          python -m zipfile -e "$RUNNER_TEMP/candidate-archive/"* .release-candidate
          python scripts/release_channels.py verify-rc-artifacts --root . --tag "$RELEASE_TAG" \
            --expected-commit "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY" --dist .release-candidate/dist
          test -s .release-candidate/lixity-release.cdx.json
          mv .release-candidate/dist dist
      - name: Attest the promoted release artifacts for this tag
        if: steps.release_state.outputs.state != 'published'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*
      - name: Attest the SBOM for the verified wheel and source archive
        if: steps.release_state.outputs.state != 'published'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
          sbom-path: .release-candidate/lixity-release.cdx.json
      - name: Fetch the signed desktop bundle identified by preflight
        if: steps.release_state.outputs.state != 'published' && needs.preflight.outputs.desktop_artifact_id != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.preflight.outputs.desktop_run_id }}
          artifact-ids: ${{ needs.preflight.outputs.desktop_artifact_id }}
          path: ${{ runner.temp }}/desktop-candidate-archive
          skip-decompress: true
      - name: Stage qualified desktop assets from the reviewed candidate
        if: steps.release_state.outputs.state != 'published' && needs.preflight.outputs.desktop_artifact_id != ''
        env:
          DESKTOP_QUALIFICATION: ${{ vars.DESKTOP_RELEASE_QUALIFICATION }}
          DESKTOP_QUALIFICATION_DIGEST: ${{ needs.preflight.outputs.desktop_qualification_digest }}
        run: |
          python -m zipfile -e "$RUNNER_TEMP/desktop-candidate-archive/"* "$RUNNER_TEMP/desktop-candidate"
          printf '%s' "$DESKTOP_QUALIFICATION" > "$RUNNER_TEMP/desktop-qualification.json"
          printf '%s  %s\n' "$DESKTOP_QUALIFICATION_DIGEST" "$RUNNER_TEMP/desktop-qualification.json" | sha256sum --check -
          python scripts/release_channels.py stage-desktop --root . --tag "$RELEASE_TAG" \
            --expected-commit "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY" \
            --artifacts-dir "$RUNNER_TEMP/desktop-candidate" \
            --qualification "$RUNNER_TEMP/desktop-qualification.json" --desktop-dist dist-desktop
      - name: Select the asset files for the draft
        if: steps.release_state.outputs.state != 'published'
        id: release_files
        run: |
          {
            echo 'files<<RELEASE_ASSETS'
            echo 'dist/*'
            if [[ -d dist-desktop ]]; then echo 'dist-desktop/*'; fi
            echo 'RELEASE_ASSETS'
          } >> "$GITHUB_OUTPUT"
      # Only unpublished drafts may be changed. Validate every uploaded digest
      # before publication locks the assets and tag permanently.
      - name: Create draft release with artifacts
        if: steps.release_state.outputs.state != 'published'
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: ${{ steps.release_files.outputs.files }}
          fail_on_unmatched_files: true
          draft: true
          body_path: docs/releases/${{ github.ref_name }}.md
          generate_release_notes: true
      - name: Verify and publish the complete draft
        if: steps.release_state.outputs.state != 'published'
        run: |
          args=()
          if [[ -n "$DESKTOP_ARTIFACT_ID" ]]; then args+=(--require-desktop --desktop-dist dist-desktop); fi
          python scripts/release_channels.py verify-draft --root . --tag "$RELEASE_TAG" \
            --expected-commit "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY" --dist dist "${args[@]}"
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
        env:
          DESKTOP_ARTIFACT_ID: ${{ needs.preflight.outputs.desktop_artifact_id }}
      - name: Verify the immutable GitHub publication
        run: |
          args=()
          if [[ -d dist-desktop ]]; then args+=(--require-desktop --desktop-dist dist-desktop); fi
          python scripts/release_channels.py verify-github --root . --tag "$RELEASE_TAG" \
            --expected-commit "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY" --dist dist "${args[@]}"
      - name: Stage the same verified artifacts for the PyPI job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          overwrite: true

  pypi:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Existing trusted publisher configuration and automatic authorization stay
    # unchanged. Catch-up promotes immutable GitHub assets and never builds.
    if: vars.PUBLISH_PYPI == 'true' && !cancelled() && (github.event_name == 'workflow_dispatch' || needs.publish.result == 'success')
    environment: pypi
    permissions:
      contents: read
      attestations: read
      id-token: write
    concurrency:
      group: release-pypi-publication
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Check out the selected release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.sha }}
          path: release-source
          persist-credentials: false
      - name: Check out helpers from this workflow revision
        # Older selected tags may predate these helpers. Their package bytes are
        # compared with release-source, never with the current workflow source.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-tools
          persist-credentials: false
      - name: Record the selected source commit
        id: source
        run: echo "sha=$(git -C release-source rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Fetch the same verified artifacts from the publish job
        if: github.event_name == 'push'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dist
          path: ${{ runner.temp }}/distribution-archive
          skip-decompress: true
      - name: Extract the verified distribution archive
        if: github.event_name == 'push'
        run: python -m zipfile -e "$RUNNER_TEMP/distribution-archive/"* dist
      - name: Recover immutable GitHub artifacts for catch-up
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          python .release-tools/scripts/release_channels.py recover --root release-source --tag "$RELEASE_TAG" \
            --expected-commit "$RELEASE_SHA" --repo "$GITHUB_REPOSITORY" --dist dist --python-only
      - name: Reconcile every existing PyPI filename and digest before staging missing files
        id: reconcile
        env:
          RELEASE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          python .release-tools/scripts/release_channels.py stage-pypi --root release-source --tag "$RELEASE_TAG" \
            --expected-commit "$RELEASE_SHA" --repo "$GITHUB_REPOSITORY" --dist dist --upload upload \
            --github-output "$GITHUB_OUTPUT"
      - name: Publish missing identical distributions with trusted publishing
        if: steps.reconcile.outputs.upload_count != '0'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: upload
      - name: Verify complete PyPI publication against the immutable GitHub files
        env:
          RELEASE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          python .release-tools/scripts/release_channels.py verify-pypi --root release-source --tag "$RELEASE_TAG" \
            --expected-commit "$RELEASE_SHA" --repo "$GITHUB_REPOSITORY" --dist dist

  pages:
    needs: [publish, pypi]
    # A PyPI catch-up can select an older release. Only tag-triggered runs
    # deploy that release's documentation.
    if: >-
      !cancelled() && github.event_name == 'push' && needs.publish.result == 'success' &&
      (needs.pypi.result == 'success' ||
       (vars.PUBLISH_PYPI != 'true' && needs.pypi.result == 'skipped'))
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    with:
      source_ref: ${{ github.sha }}
      release_tag: ${{ github.ref_name }}
