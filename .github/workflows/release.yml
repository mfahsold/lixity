name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish to PyPI (for example v0.4.2)
        required: true
        type: string
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  source_checks:
    if: github.event_name == 'push'
    permissions:
      contents: read
    uses: ./.github/workflows/tests.yml

  browser_checks:
    # Avoid starting the longer browser run when the source gate has failed.
    needs: source_checks
    if: github.event_name == 'push'
    permissions:
      contents: read
    uses: ./.github/workflows/browser.yml

  publish:
    needs: [source_checks, browser_checks]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Build, verify and smoke-test release artifacts
        run: |
          python -m pip install build
          python scripts/check_release.py --build --smoke --tag "$GITHUB_REF_NAME"
      - name: Attest the release artifacts
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*
      - name: Check whether the release is already published
        id: release_state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft' 2>/dev/null || echo missing)
          if [ "$state" = "false" ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "Release $GITHUB_REF_NAME is already published; skipping release edits."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      # Draft first, attach every asset, then publish: one atomic release that
      # stays compatible with immutable releases. Re-runs of an already
      # published (immutable) release skip these two steps and only restage the
      # verified artifacts for the PyPI job.
      - name: Create draft release with artifacts
        if: steps.release_state.outputs.published == 'false'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: dist/*
          fail_on_unmatched_files: true
          draft: true
          body_path: docs/releases/${{ github.ref_name }}.md
          generate_release_notes: true
      - name: Publish the verified draft
        if: steps.release_state.outputs.published == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest
      - name: Stage the verified artifacts for the PyPI job
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  pypi:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Trusted publishing stays disabled until the PyPI publisher for this
    # repository exists; set the repository variable PUBLISH_PYPI to "true"
    # after configuring it (Settings -> Secrets and variables -> Actions).
    # On workflow_dispatch the publish job is skipped and this job builds the
    # tagged source itself, so an already published (immutable) GitHub release
    # never has to be recreated just to reach PyPI.
    if: vars.PUBLISH_PYPI == 'true' && !cancelled() && (github.event_name == 'workflow_dispatch' || needs.publish.result == 'success')
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Fetch the verified artifacts
        if: github.event_name == 'push'
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Check out the release tag
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v7
        with:
          ref: ${{ format('refs/tags/{0}', inputs.tag) }}
      - name: Verify the published GitHub release before catch-up
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')" = false
      - name: Build, verify and smoke-test the release artifacts
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python -m pip install build
          python scripts/check_release.py --build --smoke --tag "$RELEASE_TAG"
      - name: Select the distribution files
        # The release job also attests SHA256SUMS; PyPI accepts only the wheel
        # and the sdist, so the upload directory carries exactly those two.
        run: |
          mkdir -p upload
          cp dist/*.whl dist/*.tar.gz upload/
      - name: Publish to PyPI with trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: upload
          # Catch-up runs are idempotent: uploaded files are skipped.
          skip-existing: true

  pages:
    needs: [publish, pypi]
    if: >-
      !cancelled() &&
      ((github.event_name == 'push' && needs.publish.result == 'success' &&
        (needs.pypi.result == 'success' ||
         (vars.PUBLISH_PYPI != 'true' && needs.pypi.result == 'skipped'))) ||
       (github.event_name == 'workflow_dispatch' && needs.pypi.result == 'success'))
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    with:
      source_ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
