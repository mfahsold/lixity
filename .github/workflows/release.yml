name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Build, verify and smoke-test release artifacts
        run: |
          python -m pip install build
          python scripts/check_release.py --build --smoke --tag "$GITHUB_REF_NAME"
      - name: Attest the release artifacts
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*
      # Draft first, attach every asset, then publish: one atomic release that
      # stays compatible with immutable releases.
      - name: Create draft release with artifacts
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: dist/*
          fail_on_unmatched_files: true
          draft: true
          body_path: docs/releases/${{ github.ref_name }}.md
          generate_release_notes: true
      - name: Publish the verified draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest
      - name: Stage the verified artifacts for the PyPI job
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  pypi:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Trusted publishing stays disabled until the PyPI publisher for this
    # repository exists; set the repository variable PUBLISH_PYPI to "true"
    # after configuring it (Settings -> Secrets and variables -> Actions).
    if: vars.PUBLISH_PYPI == 'true'
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Fetch the verified artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Select the distribution files
        # The release job also attests SHA256SUMS; PyPI accepts only the wheel
        # and the sdist, so the upload directory carries exactly those two.
        run: |
          mkdir -p upload
          cp dist/*.whl dist/*.tar.gz upload/
      - name: Publish to PyPI with trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: upload
