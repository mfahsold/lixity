name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            .github/workflows/release.yml
      - run: make install-dev PYTHON=python
      - name: Install native PDF test dependencies
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Check and prepare release artifacts
        run: make release-check RELEASE_TAG="$GITHUB_REF_NAME"
      - name: Create GitHub Release with artifacts
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          fail_on_unmatched_files: true
          make_latest: true
          body_path: docs/releases/${{ github.ref_name }}.md
          generate_release_notes: true
