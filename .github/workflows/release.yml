name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install ".[dev]"
      - name: Validate release source
        run: |
          python -m pytest -W error -q -p no:asyncio
          ruff check src tests scripts
          mypy
      - run: python -m build
      - name: Verify wheel version matches tag
        run: |
          python - <<'PY'
          import glob, os, re, sys, zipfile
          from pathlib import Path

          tag = os.environ["GITHUB_REF_NAME"]
          expected = tag[1:] if tag.startswith("v") else tag
          version_py = Path("src/lixity/_version.py").read_text(encoding="utf-8")
          m = re.search(r'__version__\s*=\s*"([^"]+)"', version_py)
          if not m:
              sys.exit("could not read __version__")
          if m.group(1) != expected:
              sys.exit(f"tag {tag} != package version {m.group(1)}")
          wheel = glob.glob("dist/*.whl")[0]
          zf = zipfile.ZipFile(wheel)
          dist_info = next(n for n in zf.namelist() if n.endswith(".dist-info/METADATA"))
          metadata = zf.read(dist_info).decode("utf-8")
          if f"Version: {expected}" not in metadata:
              sys.exit("wheel METADATA version mismatch")
          print(f"release {expected} OK")
          PY
      - name: Verify isolated wheel installation
        run: |
          python -m venv /tmp/lixity-release-smoke
          /tmp/lixity-release-smoke/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/lixity-release-smoke/bin/python -m pip check
          /tmp/lixity-release-smoke/bin/lixity --version
          /tmp/lixity-release-smoke/bin/lixity about --json
      - name: Generate artifact checksums
        run: sha256sum dist/*.whl dist/*.tar.gz > dist/SHA256SUMS
      - name: Create GitHub Release with artifacts
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          fail_on_unmatched_files: true
          body_path: docs/releases/${{ github.ref_name }}.md
          generate_release_notes: true
