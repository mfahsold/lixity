name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Build, verify and smoke-test release artifacts
        run: |
          python -m pip install build
          python scripts/check_release.py --build --smoke --tag "$GITHUB_REF_NAME"
      - name: Create GitHub Release with artifacts
        # Third-party publisher pinned to the reviewed v3 commit.
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: dist/*
          fail_on_unmatched_files: true
          make_latest: true
          body_path: docs/releases/${{ github.ref_name }}.md
          generate_release_notes: true
