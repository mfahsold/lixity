name: tests
on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install . pytest
      - name: Install native PDF test dependencies
        if: matrix.python-version == '3.12'
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Run the full suite with warnings treated as errors
        if: matrix.python-version == '3.12'
        run: python -m pytest -W error -q -p no:asyncio
        env:
          PYTHONPATH: src
      - name: Run all nonnative tests on each compatibility Python
        if: matrix.python-version != '3.12'
        run: python -m pytest -W error -q -p no:asyncio -m "not native_pdf"
        env:
          PYTHONPATH: src

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pydantic rich orjson ruff==0.16.8 mypy
      - run: ruff check src tests scripts
      - run: mypy

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install build
      - name: Build and verify wheel and source archive
        run: python scripts/check_release.py --build
