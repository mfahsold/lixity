# Full source checks run locally and are reusable by the tagged release.
name: tests
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      pytest_workers:
        description: Compare pytest wall time on the same commit (0 runs serially)
        type: choice
        options: ['0', '2', '4']
        default: '4'
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install ".[dev]"
      - name: Install native PDF and audio test dependencies
        run: sudo apt-get update && sudo apt-get install -y poppler-utils ffmpeg
      - run: ruff check src tests scripts
      - run: mypy
      - name: Run the full suite with warnings treated as errors
        run: time python -m pytest -W error -q -p no:asyncio -n "$PYTEST_WORKERS"
        env:
          PYTHONPATH: src
          PYTEST_WORKERS: ${{ github.event_name == 'workflow_dispatch' && inputs.pytest_workers || '4' }}
      - name: Build and smoke-install wheel on this Python version
        run: |
          python -m pip install build
          python scripts/check_release.py --build --smoke --dist "${{ runner.temp }}/dist-${{ matrix.python-version }}"
