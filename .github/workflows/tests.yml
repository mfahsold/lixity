name: tests
on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install ".[dev]"
      - name: Install native PDF test dependencies
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: ruff check src tests scripts
      - run: mypy
      - name: Run the full suite with warnings treated as errors
        run: python -m pytest -W error -q -p no:asyncio
        env:
          PYTHONPATH: src
