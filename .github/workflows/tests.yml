name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: src
      - run: pip install pytest
      - run: PYTHONPATH=src python -m pytest -W error -q -p no:asyncio

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install .
      - run: npm install --no-save playwright@1.59.1
      - run: npx playwright install --with-deps chromium
      - name: Check rendered desktop and mobile workflows
        env:
          PYTHON_BIN: python
        run: |
          node tests/browser/style-space.cjs
          node tests/browser/settings.cjs
          node tests/browser/layout.cjs
          node tests/browser/research.cjs

  research-platforms:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install . pytest
      - run: python -m pytest tests/test_research.py tests/test_research_analysis.py tests/test_research_lifecycle.py -W error -q -p no:asyncio

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pydantic rich orjson ruff==0.16.8 mypy
      - run: ruff check src tests scripts
      - run: mypy

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build --wheel
      - name: Verify wheel contains UI assets, typing marker and version metadata
        run: |
          python - <<'PY'
          import glob, re, sys, zipfile
          from pathlib import Path

          wheel = glob.glob("dist/*.whl")[0]
          zf = zipfile.ZipFile(wheel)
          names = set(zf.namelist())
          required = {
              "lixity/py.typed",
              "lixity/ui/assets/dashboard.css",
              "lixity/ui/assets/dashboard.js",
              "lixity/ui/assets/style-space.js",
              "lixity/pipeline.py",
              "lixity/workspace_labels.py",
              "lixity/research/api.py",
              "lixity/research/analysis.py",
              "lixity/research/models.py",
              "lixity/research/repository.py",
              "lixity/research/catalogue.py",
              "lixity/research/cli.py",
              "lixity/_version.py",
          }
          missing = sorted(required - names)
          if missing:
              sys.exit(f"missing in wheel: {missing}")

          version_py = Path("src/lixity/_version.py").read_text(encoding="utf-8")
          m = re.search(r'__version__\s*=\s*"([^"]+)"', version_py)
          if not m:
              sys.exit("could not read __version__ from _version.py")
          expected = m.group(1)
          dist_info = next(n for n in names if n.endswith(".dist-info/METADATA"))
          metadata = zf.read(dist_info).decode("utf-8")
          if f"Version: {expected}" not in metadata:
              sys.exit(f"wheel METADATA version does not match {expected}")
          print(f"wheel OK: {expected}")
          PY
