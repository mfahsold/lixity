name: tests
on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install . pytest
      - name: Install native PDF test dependencies
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Run the full suite with warnings treated as errors
        run: python -m pytest -W error -q -p no:asyncio
        env:
          PYTHONPATH: src

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: python -m pip install .
      - run: npm install --no-save playwright@1.59.1
      - run: npx playwright install --with-deps chromium
      - name: Check rendered desktop and mobile workflows
        env:
          PYTHON_BIN: python
        run: |
          node tests/browser/style-space.cjs
          node tests/browser/settings.cjs
          node tests/browser/layout.cjs
          node tests/browser/research.cjs
          node tests/browser/list-filters.cjs
          node tests/browser/project-controls.cjs
          node tests/browser/scenes.cjs
          node tests/browser/docs.cjs
          node tests/browser/visual-consistency.cjs

  research-platforms:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install . pytest
      - name: Install native PDF test dependencies
        if: runner.os == 'macOS'
        run: brew install poppler
      - name: Run every research suite on this platform
        run: >-
          python -c "from pathlib import Path; import pytest; tests = sorted(Path('tests').glob('test_research*.py')); assert tests, 'No research tests found'; raise SystemExit(pytest.main([str(path) for path in tests] + ['-W', 'error', '-q', '-p', 'no:asyncio']))"

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pydantic rich orjson ruff==0.16.8 mypy
      - run: ruff check src tests scripts
      - run: mypy

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build --wheel
      - name: Verify wheel matches package source and version metadata
        run: |
          python - <<'PY'
          import glob, re, sys, zipfile
          from pathlib import Path

          wheel = glob.glob("dist/*.whl")[0]
          zf = zipfile.ZipFile(wheel)
          names = set(zf.namelist())
          source = Path("src/lixity")
          files = set(source.rglob("*.py")) | {source / "py.typed"}
          files.update(path for path in (source / "ui/assets").iterdir() if path.is_file())
          expected_files = {"lixity/" + path.relative_to(source).as_posix(): path for path in files}
          shipped = {name for name in names if name.startswith("lixity/")}
          missing = sorted(expected_files.keys() - shipped)
          extra = sorted(shipped - expected_files.keys())
          if missing or extra:
              sys.exit(f"wheel package members differ: missing={missing}, extra={extra}")
          changed = sorted(name for name, path in expected_files.items()
                           if zf.read(name) != path.read_bytes())
          if changed:
              sys.exit(f"wheel contents differ from source: {changed}")

          version_py = Path("src/lixity/_version.py").read_text(encoding="utf-8")
          m = re.search(r'__version__\s*=\s*"([^"]+)"', version_py)
          if not m:
              sys.exit("could not read __version__ from _version.py")
          expected = m.group(1)
          dist_info = next(n for n in names if n.endswith(".dist-info/METADATA"))
          metadata = zf.read(dist_info).decode("utf-8")
          if f"Version: {expected}" not in metadata:
              sys.exit(f"wheel METADATA version does not match {expected}")
          print(f"wheel OK: {expected}")
          PY
