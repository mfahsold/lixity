# Full source checks run locally and are reusable by the tagged release.
name: tests
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      pytest_workers:
        description: Compare pytest wall time on the same commit (0 runs serially)
        type: choice
        options: ['0', '2', '4']
        default: '4'
  workflow_call:
    inputs:
      stage_candidate:
        description: Retain the verified Python 3.12 distribution and its SBOM in this run
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install ".[dev]"
      - name: Install native PDF and audio test dependencies
        run: sudo apt-get update && sudo apt-get install -y poppler-utils ffmpeg
      - name: Run shared static checks
        if: matrix.python-version == '3.12'
        run: make lint typecheck VPY=python
      - name: Run the full suite with warnings treated as errors
        run: time make test VPY=python PYTEST_ARGS="-n $PYTEST_WORKERS"
        env:
          PYTEST_WORKERS: ${{ github.event_name == 'workflow_dispatch' && inputs.pytest_workers || '4' }}
      - name: Build and smoke-install wheel on this Python version
        run: |
          python scripts/check_release.py --build --smoke \
            --dist "$RUNNER_TEMP/candidate/dist" \
            --install-report "$RUNNER_TEMP/lixity-pip-report.json"
      - name: Generate the SBOM from the verified distribution and smoke install
        if: inputs.stage_candidate && matrix.python-version == '3.12'
        run: |
          python scripts/dependency_inventory.py sbom \
            --python-report "$RUNNER_TEMP/lixity-pip-report.json" \
            --dist "$RUNNER_TEMP/candidate/dist" --source-sha "$GITHUB_SHA" \
            --output "$RUNNER_TEMP/candidate/lixity-release.cdx.json"
      - name: Stage the verified release candidate for this run
        if: inputs.stage_candidate && matrix.python-version == '3.12'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: verified-release-candidate
          path: ${{ runner.temp }}/candidate/
          if-no-files-found: error
          overwrite: true
