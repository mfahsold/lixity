name: dependencies
on:
  pull_request:
    branches: [main]
    paths:
      - .gitattributes
      - .github/dependabot.yml
      - .github/workflows/dependencies.yml
      - pyproject.toml
      - MANIFEST.in
      - scripts/browser-vendor.json
      - scripts/check_release.py
      - scripts/dependency_inventory.py
      - scripts/editor/**
      - src/lixity/ui/assets/vendor/**
      - tests/test_dependency_inventory.py
  schedule:
    - cron: '34 6 * * 2'
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  python_runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          # The minimum supported Python includes the tomli marker dependency.
          python-version: '3.10'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Resolve the default runtime and record the shipped browser inventory
        run: |
          python -m pip install --dry-run --ignore-installed --report "$RUNNER_TEMP/pip-resolution.json" .
          python scripts/dependency_inventory.py sbom --source-sha "$GITHUB_SHA" \
            --python-report "$RUNNER_TEMP/pip-resolution.json" \
            --python-requirements "$RUNNER_TEMP/lixity-runtime.txt" \
            --output "$RUNNER_TEMP/lixity-runtime.cdx.json"
      - name: Upload the resolved inventory
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: lixity-source-sbom-${{ github.run_attempt }}
          path: ${{ runner.temp }}/lixity-runtime.cdx.json
          if-no-files-found: error
      - name: Audit the same pinned Python runtime resolution
        run: |
          python -m pip install pip-audit
          python -m pip_audit --progress-spinner off --strict --require-hashes --disable-pip \
            -r "$RUNNER_TEMP/lixity-runtime.txt"

  browser_dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: scripts/editor
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        id: node
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: scripts/editor/package-lock.json
      - name: Verify checked-in editor bundle, notices and ship list without writing them
        run: |
          npm ci --ignore-scripts --no-audit
          npm run check
      - name: Audit the editor lock, including contributor build tools
        if: ${{ !cancelled() && steps.node.outcome == 'success' }}
        run: npm audit --package-lock-only
      - name: Audit exact standalone browser pins separately
        if: ${{ !cancelled() && steps.node.outcome == 'success' }}
        working-directory: .
        run: python3 scripts/dependency_inventory.py audit-vendors
