# Browser regression suites are local-first: run `make browser` after UI
# changes and before preparing a release. This workflow runs the same script
# in one Chromium job on manual dispatch only.
name: browser
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: python -m pip install .
      - run: npm install --no-save playwright@1.59.1
      - run: npx playwright install --with-deps chromium
      - name: Run all browser regression suites
        env:
          PYTHON_BIN: python
        run: python scripts/run_browser_suites.py
