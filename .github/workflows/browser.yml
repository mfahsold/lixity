# Browser regression suites are local-first: run `make browser` after UI
# changes and before preparing a release. Tagged releases reuse this same full
# Chromium workflow as an independent publication gate.
name: browser
on:
  workflow_dispatch:
    inputs:
      suites:
        description: Optional space-separated browser suite names for focused debugging
        type: string
        required: false
  workflow_call:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: python -m pip install ".[dev]"
      - name: Install synthetic media test dependency
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm install --no-save playwright@1.59.1 axe-core@4.13.0
      - run: npx playwright install --with-deps chromium
      - name: Run all browser regression suites
        env:
          PYTHON_BIN: python
          SUITES: ${{ github.event_name == 'workflow_dispatch' && inputs.suites || '' }}
        run: |
          if [ -n "$SUITES" ]; then
            read -r -a suite_names <<< "$SUITES"
            python scripts/run_browser_suites.py --only "${suite_names[@]}" --jobs 3
          else
            make browser-full PYTHON=python
          fi
