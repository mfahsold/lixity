# Browser regression suites are local-first: run `make browser` after UI
# changes and before preparing a release. Tagged releases and release-candidate
# checks reuse this same sharded Chromium workflow as a publication gate.
name: browser
on:
  workflow_dispatch:
    inputs:
      suites:
        description: Optional space-separated browser suite names for focused debugging
        type: string
        required: false
  workflow_call:
permissions:
  contents: read
jobs:
  browser:
    # Keep the runner on the supported LTS for Playwright 1.59.1.
    runs-on: ubuntu-24.04
    # Sharded across four hosted runners (2 workers each) for full runs; focused
    # manual dispatches run in one shard.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ github.event_name == 'workflow_dispatch' && inputs.suites != '' && fromJson('[1]') || fromJson('[1, 2, 3, 4]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
      - run: python -m pip install ".[dev]"
      - name: Install synthetic media test dependency
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm install --no-save playwright@1.59.1 axe-core@4.13.0
      - run: npx playwright install --with-deps chromium
      - name: Run browser regression suites (shard ${{ matrix.shard }})
        id: suites
        env:
          PYTHON_BIN: python
          LIXITY_BROWSER_DIAGNOSTICS: ${{ runner.temp }}/lixity-browser-evidence
          SUITES: ${{ github.event_name == 'workflow_dispatch' && inputs.suites || '' }}
          SHARD: ${{ matrix.shard }}
        run: |
          if [ -n "$SUITES" ]; then
            read -r -a suite_names <<< "$SUITES"
            python scripts/run_browser_suites.py --only "${suite_names[@]}" --jobs 3
          else
            make browser-full PYTHON=python BROWSER_JOBS=2 BROWSER_ARGS="--shard ${SHARD}/4"
          fi
      - name: Summarize browser evidence
        if: always()
        env:
          BROWSER_STEP_OUTCOME: ${{ steps.suites.outcome }}
          SHARD: ${{ matrix.shard }}
        run: |
          printf 'Browser shard %s outcome: %s\n\n' "$SHARD" "$BROWSER_STEP_OUTCOME" >> "$GITHUB_STEP_SUMMARY"
          python scripts/run_browser_suites.py --summary "$RUNNER_TEMP/lixity-browser-evidence" >> "$GITHUB_STEP_SUMMARY"
      - name: Retain bounded synthetic browser diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: browser-evidence-${{ github.run_id }}-${{ github.run_attempt }}-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/lixity-browser-evidence
          if-no-files-found: warn
          retention-days: 7
