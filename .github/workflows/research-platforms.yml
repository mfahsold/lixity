name: research-platforms
on:
  push:
    branches: ["main"]
    paths:
      - "src/**"
      - "tests/test_research*.py"
      - "tests/test_service*.py"
      - "tests/test_server_startup.py"
      - "tests/test_server_research*.py"
      - "tests/test_launcher*.py"
      - "scripts/**"
      - "pyproject.toml"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "src/**"
      - "tests/test_research*.py"
      - "tests/test_service*.py"
      - "tests/test_server_startup.py"
      - "tests/test_server_research*.py"
      - "tests/test_launcher*.py"
      - "scripts/**"
      - "pyproject.toml"
      - ".github/workflows/**"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  research-platforms:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install . pytest
      - name: Install native PDF test dependencies
        if: runner.os == 'macOS'
        run: brew install poppler
      - name: Run research and packaged lifecycle suites on this platform
        run: >-
          python -c "from pathlib import Path; import pytest; patterns = ('test_research*.py', 'test_service*.py', 'test_server_startup.py', 'test_server_research*.py', 'test_launcher*.py'); tests = sorted({path for pattern in patterns for path in Path('tests').glob(pattern)}); assert tests, 'No platform tests found'; raise SystemExit(pytest.main([str(path) for path in tests] + ['-W', 'error', '-q', '-p', 'no:asyncio']))"
