# Cross-platform suites are local-first. Dispatch focused portability seams
# when a change needs macOS/Windows evidence; request full research explicitly.
name: research-platforms
on:
  workflow_dispatch:
    inputs:
      scope:
        description: Portability seams by default; full research/lifecycle suite only when needed
        type: choice
        default: portability
        options: [portability, full]
  workflow_call:
    inputs:
      scope:
        description: Full research/lifecycle coverage or focused portability seams
        type: string
        default: full
permissions:
  contents: read
concurrency:
  group: research-platforms-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  research-platforms:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install . pytest
      - name: Install native PDF test dependencies
        if: runner.os == 'macOS' && inputs.scope == 'full'
        run: brew install poppler
      - name: Run selected native research and packaged lifecycle checks
        env:
          NATIVE_SCOPE: ${{ inputs.scope }}
        run: python scripts/run_native_tests.py
