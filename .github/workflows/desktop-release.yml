name: desktop-release
on:
  workflow_dispatch:
    inputs:
      notarize_macos:
        description: Sign and notarize macOS candidates with Apple Developer ID
        type: boolean
        default: false
      sign_windows:
        description: Sign Windows candidates with Azure Artifact Signing
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Check desktop installer version pins before starting the build matrix
        run: python scripts/check_release.py --source-only --desktop-version

  rust-supply-chain:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify Rust crate licenses (AGPL-3.0 compatible), advisories and sources
        uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3
        with:
          manifest-path: desktop/Cargo.toml
          command: check
          arguments: --locked --config desktop/deny.toml
          command-arguments: ""

  build-installers:
    needs: preflight
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      TAURI_CLI_VERSION: "2.12.6"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
            expect_args: "--expect-kind linux-deb --expect-kind linux-appimage"
          - os: macos-latest
            target: aarch64-apple-darwin
            bundles: app
            expect_args: "--expect-kind macos-dmg"
          - os: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app
            expect_args: "--expect-kind macos-dmg"
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
            expect_args: "--expect-kind windows-nsis --expect-kind windows-msi"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify the native runner matches the installer target
        shell: bash
        env:
          EXPECTED_TARGET: ${{ matrix.target }}
        run: |
          host_target="$(rustc -vV | tr -d '\r' | sed -n 's/^host: //p')"
          if [[ "$host_target" != "$EXPECTED_TARGET" ]]; then
            echo "::error::Rust host target '$host_target' does not match '$EXPECTED_TARGET'."
            exit 1
          fi

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      - name: Prepare Apple Developer ID signing
        if: runner.os == 'macOS' && inputs.notarize_macos
        id: apple-signing
        shell: bash
        env:
          APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: bash desktop/scripts/prepare_macos_signing.sh

      - name: Prepare Azure Artifact Signing
        if: runner.os == 'Windows' && inputs.sign_windows
        id: azure-signing
        shell: pwsh
        env:
          LIXITY_AZURE_SIGNING_ENDPOINT: ${{ vars.LIXITY_AZURE_SIGNING_ENDPOINT }}
          LIXITY_AZURE_SIGNING_ACCOUNT: ${{ vars.LIXITY_AZURE_SIGNING_ACCOUNT }}
          LIXITY_AZURE_SIGNING_PROFILE: ${{ vars.LIXITY_AZURE_SIGNING_PROFILE }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: python desktop/scripts/windows_artifact_signing.py prepare

      - name: Install Linux desktop build and packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libasound2-dev patchelf file desktop-file-utils \
            appstream libfuse2

      - name: Install uv and managed Python 3.12 standalone runtime
        shell: bash
        run: |
          python -m pip install --upgrade pip uv build
          uv python install 3.12

      - name: Verify desktop metadata and build isolated runtime bundle
        shell: bash
        run: |
          python desktop/scripts/generate_menu_locales.py --check
          python desktop/scripts/generate_desktop_icons.py --check
          python -m build --wheel --outdir dist
          python desktop/scripts/build_runtime_bundle.py \
            --target "${{ matrix.target }}" \
            --auto-uv \
            --output desktop/build/runtime/current
          python desktop/scripts/smoke_desktop_runtime.py desktop/build/runtime/current

      - name: Test, lint and build native bundles
        working-directory: desktop
        shell: bash
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          NO_STRIP: "true"
          LIXITY_DESKTOP_BUILD_REVISION: ${{ github.sha }}
          SIGN_WINDOWS: ${{ inputs.sign_windows }}
        run: |
          cargo test --locked --manifest-path Cargo.toml --all-targets
          cargo clippy --locked --manifest-path Cargo.toml --all-targets -- -D warnings
          bundle_args=(--bundles "${{ matrix.bundles }}")
          if [ "${{ runner.os }}" = macOS ]; then
            bundle_args+=(--no-sign)
          elif [ "${{ runner.os }}" = Windows ] && [ "$SIGN_WINDOWS" = true ]; then
            bundle_args=(--no-bundle)
          fi
          npx --yes "@tauri-apps/cli@$TAURI_CLI_VERSION" build "${bundle_args[@]}" -- --locked

      - name: Bundle and sign Windows installers
        if: runner.os == 'Windows' && inputs.sign_windows
        working-directory: desktop
        shell: pwsh
        env:
          TAURI_SIGNING_CONFIG: ${{ steps.azure-signing.outputs.config }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          if (-not (Test-Path -LiteralPath $env:TAURI_SIGNING_CONFIG -PathType Leaf)) {
            throw "Missing Azure Artifact Signing configuration"
          }
          npx --yes "@tauri-apps/cli@$env:TAURI_CLI_VERSION" bundle --bundles "${{ matrix.bundles }}" --config "$env:TAURI_SIGNING_CONFIG"

      - name: Sign and package the macOS app
        if: runner.os == 'macOS'
        working-directory: desktop
        shell: bash
        env:
          NOTARIZE_MACOS: ${{ inputs.notarize_macos }}
          APPLE_SIGNING_IDENTITY: ${{ steps.apple-signing.outputs.identity }}
          APPLE_SIGNING_KEYCHAIN: ${{ steps.apple-signing.outputs.keychain }}
          APPLE_NOTARY_PROFILE: ${{ steps.apple-signing.outputs.profile }}
        run: |
          app=target/release/bundle/macos/Lixity.app
          test -x "$app/Contents/Resources/runtime/python/bin/python3.12"
          if [ "$NOTARIZE_MACOS" = true ]; then
            : "${APPLE_SIGNING_IDENTITY:?Missing Developer ID identity}"
            : "${APPLE_SIGNING_KEYCHAIN:?Missing Developer ID keychain}"
            : "${APPLE_NOTARY_PROFILE:?Missing notarization profile}"
            bash scripts/sign_macos_bundle.sh "$app"
          else
            bash scripts/sign_macos_bundle.sh --adhoc "$app"
          fi
          VERSION="$(python -c 'import json; print(json.load(open("src-tauri/tauri.conf.json"))["version"])')"
          TARGET="${{ matrix.target }}"
          DMG_ARCH="aarch64"
          case "$TARGET" in
            x86_64-*) DMG_ARCH="x64" ;;
          esac
          bash scripts/package_macos_dmg.sh "$app" \
            "target/release/bundle/dmg/Lixity_${VERSION}_${DMG_ARCH}.dmg" python

      - name: Remove the temporary signing keychain
        if: always() && runner.os == 'macOS' && inputs.notarize_macos
        shell: bash
        env:
          SIGNING_KEYCHAIN: ${{ steps.apple-signing.outputs.keychain }}
        run: |
          if [ -n "$SIGNING_KEYCHAIN" ]; then
            security delete-keychain "$SIGNING_KEYCHAIN"
          fi

      - name: Verify native installer files
        working-directory: desktop
        shell: bash
        env:
          SIGN_WINDOWS: ${{ inputs.sign_windows }}
          WINDOWS_SIGNTOOL: ${{ steps.azure-signing.outputs.signtool }}
        run: |
          signature_args=()
          if [ "${{ runner.os }}" = Windows ] && [ "$SIGN_WINDOWS" = true ]; then
            : "${WINDOWS_SIGNTOOL:?Missing Windows SDK SignTool executable}"
            signature_args=(--windows-signtool "$WINDOWS_SIGNTOOL")
          fi
          mkdir -p build/installers
          python scripts/verify_desktop_artifacts.py \
            target/release/bundle \
            --target "${{ matrix.target }}" \
            ${{ matrix.expect_args }} \
            "${signature_args[@]}" \
            --out-dir build/installers \
            --copy-to build/installers

      - name: Include the offline guide in test archives
        if: >-
          (runner.os == 'Windows' && !inputs.sign_windows) ||
          (runner.os == 'Linux' && (!inputs.sign_windows || !inputs.notarize_macos))
        shell: bash
        run: |
          platform="$(printf '%s' "$RUNNER_OS" | tr '[:upper:]' '[:lower:]')"
          cp "desktop/packaging/$platform/test-install-guide.html" \
            "desktop/build/installers/Start Here - $RUNNER_OS.html"

      - name: Upload per-platform verified installers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: desktop-installers-${{ matrix.target }}
          path: desktop/build/installers/*
          if-no-files-found: error
          retention-days: 30

  combine-checksums:
    needs: [rust-supply-chain, build-installers]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: desktop-installers-*
          path: dist-desktop
          merge-multiple: true

      - name: Verify installer bytes and render desktop release manifests
        shell: bash
        run: |
          VERSION="$(python -c 'import json; print(json.load(open("desktop/src-tauri/tauri.conf.json"))["version"])')"
          python desktop/scripts/render_package_manifests.py \
            --version "$VERSION" \
            --artifacts-dir dist-desktop \
            --out-dir dist-desktop/manifests \
            --require-public-inventory
          cat dist-desktop/SHA256SUMS-desktop.txt

      - name: Generate build provenance attestation for desktop installers
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist-desktop/*.dmg
            dist-desktop/*.exe
            dist-desktop/*.msi
            dist-desktop/*.deb
            dist-desktop/*.AppImage
            dist-desktop/desktop-artifacts-*.json
            dist-desktop/SHA256SUMS-desktop.txt

      - name: Upload combined desktop installer bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: >-
            ${{ github.ref == 'refs/heads/main' && inputs.notarize_macos && inputs.sign_windows
                && 'lixity-desktop-release-bundle' || 'lixity-desktop-test-bundle' }}
          path: dist-desktop/*
          if-no-files-found: error
          retention-days: 30
