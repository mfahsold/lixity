name: desktop
on:
  workflow_dispatch:
    inputs:
      build_bundle:
        description: Also build and verify native OS installers (.dmg, .exe/.msi, .deb/.AppImage)
        type: boolean
        default: false
  pull_request:
    paths:
      - "desktop/**"
      - "src/lixity/server/desktop.py"
      - "src/lixity/server/runtime.py"
      - "src/lixity/server/_base.py"
      - "src/lixity/server/handler.py"
      - "src/lixity/ui/assets/desktop-bridge.js"
      - ".github/workflows/desktop.yml"
      - ".github/actions/build-desktop-runtime/**"
      - ".github/actions/upload-desktop-installers/**"

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust-supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Verify Rust crate licenses (AGPL-3.0 compatible), advisories and sources
        uses: EmbarkStudios/cargo-deny-action@81891abc19297b21343b15ef67dc61e4aea74fda # v2.1.4
        with:
          manifest-path: desktop/Cargo.toml
          command: check
          arguments: --locked --config desktop/deny.toml
          command-arguments: ""

  desktop-matrix:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
            expect_args: "--expect-kind linux-deb --expect-kind linux-appimage"
          - os: macos-latest
            target: aarch64-apple-darwin
            bundles: app
            expect_args: "--expect-kind macos-dmg"
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
            expect_args: "--expect-kind windows-nsis --expect-kind windows-msi"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      - name: Install Linux WebKitGTK 4.1, ALSA and AppImage/DEB packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libasound2-dev patchelf file desktop-file-utils \
            appstream libfuse2

      - name: Verify desktop menu locales, icon sync and AppStream metadata
        shell: bash
        run: |
          python desktop/scripts/generate_menu_locales.py --check
          python desktop/scripts/generate_desktop_icons.py --check
          if command -v appstreamcli >/dev/null 2>&1; then
            appstreamcli validate --no-net desktop/packaging/linux/io.github.mfahsold.Lixity.metainfo.xml
          fi

      - uses: ./.github/actions/build-desktop-runtime
        with:
          target: ${{ matrix.target }}

      - name: Verify Rust toolchain and run desktop host tests and clippy
        shell: bash
        run: |
          rustc --version
          cargo --version
          cargo test --locked --manifest-path desktop/Cargo.toml --all-targets
          cargo clippy --locked --manifest-path desktop/Cargo.toml --all-targets -- -D warnings

      - name: Build and verify native platform installers (optional dispatch)
        if: inputs.build_bundle == true
        working-directory: desktop
        shell: bash
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          NO_STRIP: "true"
        run: |
          npx --yes @tauri-apps/cli@2 build --bundles "${{ matrix.bundles }}" -- --locked
          if [ "${{ runner.os }}" = "macOS" ] && [ -d "target/release/bundle/macos/Lixity.app" ]; then
            test -x target/release/bundle/macos/Lixity.app/Contents/Resources/runtime/python/bin/python3.12
            bash scripts/sign_macos_bundle.sh --adhoc target/release/bundle/macos/Lixity.app
            VERSION="$(python -c 'import json; print(json.load(open("src-tauri/tauri.conf.json"))["version"])')"
            TARGET="${{ matrix.target }}"
            DMG_ARCH="aarch64"
            case "$TARGET" in
              x86_64-*) DMG_ARCH="x64" ;;
            esac
            bash scripts/package_macos_dmg.sh \
              target/release/bundle/macos/Lixity.app \
              "target/release/bundle/dmg/Lixity_${VERSION}_${DMG_ARCH}.dmg" python
          fi
          mkdir -p build/installers
          python scripts/verify_desktop_artifacts.py \
            target/release/bundle \
            --target "${{ matrix.target }}" \
            ${{ matrix.expect_args }} \
            --out-dir build/installers \
            --copy-to build/installers

      - name: Verify Linux DEB dependencies on clean Ubuntu
        if: runner.os == 'Linux' && inputs.build_bundle == true
        timeout-minutes: 10
        shell: bash
        run: bash desktop/scripts/smoke_linux_deb.sh desktop/build/installers/*.deb

      - name: Upload verified native desktop installers
        if: inputs.build_bundle == true
        uses: ./.github/actions/upload-desktop-installers
        with:
          name: lixity-desktop-installers-${{ matrix.target }}
          retention-days: 14
