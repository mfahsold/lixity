name: desktop artifact upload rehearsal
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  upload-contract:
    if: startsWith(github.ref_name, 'ci/linux-webview-')
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Prepare synthetic upload fixtures
        run: |
          mkdir -p desktop/build/installers "$RUNNER_TEMP/stale"
          printf 'verified installer fixture\n' > desktop/build/installers/fixture.txt
          printf 'stale upload fixture\n' > "$RUNNER_TEMP/stale/fixture.txt"
      - name: Exercise the ordinary upload
        uses: ./.github/actions/upload-desktop-installers
        with:
          name: desktop-upload-clean-proof
          retention-days: 3
      - name: Seed a conflicting artifact name
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: desktop-upload-retry-proof
          path: ${{ runner.temp }}/stale/fixture.txt
          if-no-files-found: error
          retention-days: 3
      - name: Exercise the upload retry on this runner
        uses: ./.github/actions/upload-desktop-installers
        with:
          name: desktop-upload-retry-proof
          retention-days: 3

      - name: Move the synthetic payload away
        run: mv desktop/build/installers "$RUNNER_TEMP/used-fixtures"
      - name: Exercise two failed attempts
        id: missing
        continue-on-error: true
        uses: ./.github/actions/upload-desktop-installers
        with:
          name: desktop-no-files-proof
          retention-days: 3
      - name: Assert that the composite surfaced the final error
        env:
          FINAL_OUTCOME: ${{ steps.missing.outcome }}
        run: test "$FINAL_OUTCOME" = failure
