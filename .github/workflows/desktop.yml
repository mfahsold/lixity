name: desktop
on:
  workflow_dispatch:
    inputs:
      build_bundle:
        description: Also build and verify native OS installers (.dmg, .exe/.msi, .deb/.AppImage)
        type: boolean
        default: false
  pull_request:
    paths:
      - "desktop/**"
      - "src/lixity/server/desktop.py"
      - "src/lixity/server/runtime.py"
      - "src/lixity/server/_base.py"
      - "src/lixity/server/handler.py"
      - "src/lixity/ui/assets/desktop-bridge.js"
      - ".github/workflows/desktop.yml"

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  desktop-matrix:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
            expect_args: "--expect-kind linux-deb --expect-kind linux-appimage"
          - os: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
            expect_args: "--expect-kind macos-dmg"
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
            expect_args: "--expect-kind windows-nsis --expect-kind windows-msi"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      - name: Install Linux WebKitGTK 4.1, ALSA and AppImage/DEB packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libasound2-dev patchelf file desktop-file-utils \
            appstream libfuse2

      - name: Install uv and managed Python 3.12 standalone runtime
        shell: bash
        run: |
          python -m pip install --upgrade pip uv build
          uv python install 3.12

      - name: Verify desktop menu locales, icon sync and AppStream metadata
        shell: bash
        run: |
          python desktop/scripts/generate_menu_locales.py --check
          python desktop/scripts/generate_desktop_icons.py --check
          if command -v appstreamcli >/dev/null 2>&1; then
            appstreamcli validate --no-net desktop/packaging/linux/io.github.mfahsold.Lixity.metainfo.xml
          fi

      - name: Build Lixity wheel and isolated desktop runtime bundle
        shell: bash
        run: |
          python -m build --wheel --outdir dist
          python desktop/scripts/build_runtime_bundle.py \
            --target "${{ matrix.target }}" \
            --auto-uv \
            --output desktop/build/runtime/current

      - name: Smoke-test isolated desktop runtime bundle
        run: python desktop/scripts/smoke_desktop_runtime.py desktop/build/runtime/current

      - name: Verify Rust toolchain and run desktop host tests and clippy
        shell: bash
        run: |
          rustc --version
          cargo --version
          cargo test --manifest-path desktop/Cargo.toml --all-targets
          cargo clippy --manifest-path desktop/Cargo.toml --all-targets -- -D warnings

      - name: Build and verify native platform installers (optional dispatch)
        if: inputs.build_bundle == true
        working-directory: desktop
        shell: bash
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          NO_STRIP: "true"
        run: |
          npx --yes @tauri-apps/cli@2 build --bundles "${{ matrix.bundles }}"
          if [ "${{ runner.os }}" = "macOS" ] && [ -d "target/release/bundle/macos/Lixity.app" ]; then
            test -x target/release/bundle/macos/Lixity.app/Contents/Resources/runtime/python/bin/python3 || \
              test -x target/release/bundle/macos/Lixity.app/Contents/Resources/runtime/python/bin/python3.12
            bash scripts/sign_macos_bundle.sh --adhoc target/release/bundle/macos/Lixity.app
          fi
          mkdir -p build/installers
          python scripts/verify_desktop_artifacts.py \
            target/release/bundle \
            --target "${{ matrix.target }}" \
            ${{ matrix.expect_args }} \
            --out-dir build/installers
          find target/release/bundle -type f \
            \( -name '*.dmg' -o -name '*.exe' -o -name '*.msi' -o -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \) \
            -exec cp -v {} build/installers/ \;

      - name: Upload verified native desktop installers
        if: inputs.build_bundle == true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: lixity-desktop-installers-${{ matrix.target }}
          path: desktop/build/installers/*
          if-no-files-found: error
          retention-days: 14
