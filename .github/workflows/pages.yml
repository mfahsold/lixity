name: pages
on:
  push:
    branches: ["main"]
    paths:
      - "docs/**"
      - "scripts/stage_pages.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - name: Stage public product documentation
        run: python3 scripts/stage_pages.py --output "$RUNNER_TEMP/lixity-pages"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/lixity-pages
      - id: deployment
        uses: actions/deploy-pages@v5
