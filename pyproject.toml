[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lixity"
version = "1.8.0"
description = "Quantitative text linguistics, length-robust stylometry, tense profiling, and self-calibrating style references for literary manuscripts. Pure Python, offline, deterministic."
readme = "README.md"
requires-python = ">=3.10"
license = "LicenseRef-Lixity-Non-Commercial-License-1.0"
license-files = ["LICENSE"]
authors = [{ name = "Matthias Fahsold", email = "mfahsold@googlemail.com" }]
keywords = [
    "computational-linguistics",
    "stylometry",
    "text-analysis",
    "literary-manuscripts",
    "tense-profiling",
    "style-reference",
    "lexical-diversity",
    "readability",
    "yules-k",
    "hd-d",
    "benjamini-hochberg",
    "digital-humanities",
    "macro-editing",
    "multilingual",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = ["pydantic>=2.0.0", "rich>=13.0.0", "orjson>=3.9.0"]

[project.urls]
Homepage = "https://github.com/mfahsold/lixity"
Repository = "https://github.com/mfahsold/lixity"
Documentation = "https://github.com/mfahsold/lixity/blob/main/docs/USAGE.md"
Changelog = "https://github.com/mfahsold/lixity/blob/main/CHANGELOG.md"
Issues = "https://github.com/mfahsold/lixity/issues"

[project.scripts]
lixity = "lixity.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lixity = ["py.typed", "ui/assets/*"]

[tool.mypy]
python_version = "3.10"
files = ["src/lixity"]
ignore_missing_imports = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "BLE", "C4", "DTZ", "PERF", "PIE", "PLW", "RUF", "S", "SIM"]
allowed-confusables = ["–", "’", "σ", "−"]