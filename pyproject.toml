[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lixity"
version = "1.2.0"
description = "Lixity - quantitative text linguistics, stylometry, tense profiling, self-calibrating style passports and idempotent publication pipelines for literary markdown manuscripts. Non-commercial license."
readme = "README.md"
requires-python = ">=3.10"
license = "LicenseRef-Lixity-Non-Commercial-License-1.0"
license-files = ["LICENSE"]
authors = [{ name = "Matthias Fahsold", email = "mfahsold@googlemail.com" }]
keywords = ["computational-linguistics", "stylometry", "tense-analysis", "corpus-linguistics", "multilingual", "manuscript-analysis", "style-fingerprint", "readability", "text-analysis", "literary"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Text Processing :: Linguistic",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = ["pydantic>=2.0.0", "rich>=13.0.0", "orjson>=3.9.0"]

[project.urls]
Homepage = "https://github.com/mfahsold/lixity"
Repository = "https://github.com/mfahsold/lixity"
Documentation = "https://github.com/mfahsold/lixity/blob/main/docs/USAGE.md"
Changelog = "https://github.com/mfahsold/lixity/blob/main/CHANGELOG.md"
Issues = "https://github.com/mfahsold/lixity/issues"

[project.scripts]
lixity = "lixity.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "BLE", "C4", "PIE", "RUF", "S"]
allowed-confusables = ["–", "’", "σ", "−"]